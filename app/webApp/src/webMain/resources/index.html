    <script>
      window.__EOS_WEBGL_AVAILABLE__ = (function () {
        var attrs = { failIfMajorPerformanceCaveat: false };

        function canCreateWebGl2Context() {
          try {
            var canvas = document.createElement('canvas');
            return !!(canvas.getContext('webgl2', attrs) || canvas.getContext('webgl2'));
          } catch (e) {
            return false;
          }
        }

        return canCreateWebGl2Context();
      })();

      window.__EOS_SHOW_WEBGL_FALLBACK__ = function (reason) {
        document.documentElement.classList.add('webgl-unavailable');
        var fallback = document.getElementById('WebGlFallback');
        if (fallback) fallback.hidden = false;
        if (reason) {
          console.error('[EyeOnSite] WebGL startup failed. Compose Web fallback shown.', reason);
        }
      };

      function isWebGlStartupFailure(value) {
        var message = String(value && (value.stack || value.message || value) || '');
        return /getParameter|_glGetString|WebGL|Skiko|DirectContext/i.test(message);
      }

      window.addEventListener('error', function (event) {
        var detail = [
          event.message,
          event.filename,
          event.error && event.error.stack
        ].filter(Boolean).join('\n');

        if (isWebGlStartupFailure(detail)) {
          window.__EOS_SHOW_WEBGL_FALLBACK__(detail);
          event.preventDefault();
        }
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (isWebGlStartupFailure(event.reason)) {
          window.__EOS_SHOW_WEBGL_FALLBACK__(event.reason);
          event.preventDefault();
        }
      });
    </script>

<body>
    <canvas id="ComposeTarget" aria-hidden="true"></canvas>
    <section id="WebGlFallback" hidden>
        <div class="fallback-panel">
            <div class="fallback-brand">EyeOnSite</div>
            <h1>Graphics acceleration is unavailable</h1>
            <p>
                This browser session cannot start the secure inspection workspace because WebGL is disabled or blocked.
                Enable hardware acceleration, allow WebGL for this site, or open EyeOnSite in a clean browser profile.
            </p>
        </div>
    </section>
    <script>
      (function () {
        if (!window.WebGL2RenderingContext || !window.__EOS_WEBGL_AVAILABLE__) {
          window.__EOS_SHOW_WEBGL_FALLBACK__('WebGL2 is unavailable in this browser session.');
          return;
        }

        var script = document.createElement('script');
        script.type = 'application/javascript';
        script.src = 'webApp.js';
        document.body.appendChild(script);
      })();
    </script>
