name: Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's in this build (shown to testers)"
        required: false
        default: ""
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build & distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Write release notes
        run: |
          NOTE="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTE" ]; then
            # Extract the latest section from CHANGELOG.md (authoritative — kept by release-please)
            if [ -f CHANGELOG.md ]; then
              NOTE=$(awk '/^## /{if(found)exit; found=1; next} found{print}' CHANGELOG.md | sed '/^$/d' | head -30)
            fi
          fi
          if [ -z "$NOTE" ]; then
            NOTE="v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
          fi
          printf "v%s (build %s)\n\n%s" \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.code }}" \
            "$NOTE" > RELEASE_NOTES.txt
          cat RELEASE_NOTES.txt

      - name: Assemble client debug APK
        run: |
          ./gradlew :app:androidApp:assembleClientDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace

      - name: Distribute client APK
        run: |
          firebase appdistribution:distribute \
            app/androidApp/build/outputs/apk/client/debug/androidApp-client-debug.apk \
            --app "1:922315268903:android:9a262a3db6364511fb7f02" \
            --groups "internal" \
            --release-notes-file RELEASE_NOTES.txt
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Assemble inspector debug APK
        run: |
          ./gradlew :app:androidApp:assembleInspectorDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace

      - name: Distribute inspector APK
        run: |
          firebase appdistribution:distribute \
            app/androidApp/build/outputs/apk/inspector/debug/androidApp-inspector-debug.apk \
            --app "1:922315268903:android:83ace1bab8aeac06fb7f02" \
            --groups "internal" \
            --release-notes-file RELEASE_NOTES.txt
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
