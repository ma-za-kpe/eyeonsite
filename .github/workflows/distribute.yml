name: Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's in this build (shown to testers)"
        required: false
        default: "Internal test build"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build & distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write release notes
        run: |
          NOTE="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTE" ]; then
            NOTE="Build from $(git rev-parse --short HEAD) on $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          echo "$NOTE" > RELEASE_NOTES.txt

      - name: Assemble client debug APK
        run: ./gradlew :app:androidApp:assembleClientDebug --no-daemon --stacktrace

      - name: Distribute client APK
        run: |
          firebase appdistribution:distribute \
            app/androidApp/build/outputs/apk/client/debug/androidApp-client-debug.apk \
            --app "1:922315268903:android:9a262a3db6364511fb7f02" \
            --groups "internal" \
            --release-notes-file RELEASE_NOTES.txt
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Assemble inspector debug APK
        run: ./gradlew :app:androidApp:assembleInspectorDebug --no-daemon --stacktrace

      - name: Distribute inspector APK
        run: |
          firebase appdistribution:distribute \
            app/androidApp/build/outputs/apk/inspector/debug/androidApp-inspector-debug.apk \
            --app "1:922315268903:android:9a262a3db6364511fb7f02" \
            --groups "internal" \
            --release-notes-file RELEASE_NOTES.txt
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
